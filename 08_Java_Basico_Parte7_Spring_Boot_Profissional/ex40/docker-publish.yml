# Exercício 40: gera a imagem Docker tagueada com o SHA do commit (github.sha). Salve em .github/workflows/
name: Imagem Docker
on:
  push:
    branches: [ main ]
env:
  IMAGEM: ghcr.io/${{ github.repository_owner }}/api-pedidos
jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGEM }}:${{ github.sha }}
            ${{ env.IMAGEM }}:latest
